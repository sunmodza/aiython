<text x="119" y="440" text-anchor="end" fill="#77dfb8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">16</text>
<text x="145" y="440" text-anchor="start" fill="#ffffff" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="700">print(queues, summary)</text>
<text x="65" y="543" text-anchor="start" fill="#77dfb8" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700">LINE 16</text>
