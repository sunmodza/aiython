<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title description">
<title id="title">How Aiython routes two tickets and summarizes the queues</title>
<desc id="description">The frontend marks two red-underlined expressions in memory. Python routes the first ticket to bug and the second to billing, making one classification call per loop iteration. After the loop, one AI call summarizes the completed queues. Python prints both queues and the summary.</desc>
<rect x="0" y="0" width="1560" height="620" rx="24" fill="#0b1726" stroke="none" stroke-width="1"/>
<text x="40" y="57" text-anchor="start" fill="#eef6ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700">Two tickets → two classifications → one summary</text>
<text x="40" y="91" text-anchor="start" fill="#b9cfdf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Arrow = current line. Red squiggles = invalid in plain Python. Lit box = current phase.</text>
<rect x="40" y="116" width="830" height="452" rx="19" fill="#142334" stroke="#405a70" stroke-width="2"/>
