<text x="838" y="147" text-anchor="end" fill="#a6c0d2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">SOURCE VIEW</text>
<rect x="57" y="172" width="796" height="334" rx="11" fill="#0f1d2d" stroke="none" stroke-width="1"/>
<text x="119" y="216" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">11</text>
<text x="145" y="216" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">for ticket in tickets:</text>
<text x="119" y="272" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">12</text>
<text x="191" y="272" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">kind: Literal["bug", "billing"] = classify this ticket</text>
<path d="M580 282 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q1.25 -5 2.5 0 q1.25 5 2.5 0" fill="none" stroke="#ff6e78" stroke-width="2.8" stroke-linecap="round"/>
<text x="119" y="328" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">13</text>
<text x="191" y="328" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">queues[kind].append(ticket)</text>
<text x="119" y="384" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">15</text>
