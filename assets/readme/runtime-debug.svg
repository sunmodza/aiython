<text x="987" y="202" text-anchor="middle" fill="#b4c8d7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700">PREPARE CODE</text>
<text x="987" y="221" text-anchor="middle" fill="#8da4b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400">mark AI span</text>
<rect x="1068" y="177" width="125" height="57" rx="11" fill="#1d2a39" stroke="#486075" stroke-width="2"/>
<text x="1130" y="202" text-anchor="middle" fill="#b4c8d7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">PYTHON</text>
<text x="1130" y="221" text-anchor="middle" fill="#8da4b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400">run loop</text>
<rect x="1211" y="177" width="125" height="57" rx="11" fill="#1d2a39" stroke="#486075" stroke-width="2"/>
<text x="1273" y="202" text-anchor="middle" fill="#b4c8d7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">AI RUNTIME</text>
<text x="1273" y="221" text-anchor="middle" fill="#8da4b7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400">context + model</text>
<rect x="1354" y="177" width="142" height="57" rx="11" fill="#193c34" stroke="#77dfb8" stroke-width="2"/>
<text x="1425" y="202" text-anchor="middle" fill="#77dfb8" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">PYTHON</text>
<text x="1425" y="221" text-anchor="middle" fill="#e1ebf3" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400">resume loop</text>
<text x="1059" y="211" text-anchor="middle" fill="#617e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">→</text>
<text x="1202" y="211" text-anchor="middle" fill="#617e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">→</text>
<text x="1345" y="211" text-anchor="middle" fill="#77dfb8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">→</text>
<rect x="924" y="255" width="572" height="293" rx="13" fill="#0d1b29" stroke="#77dfb8" stroke-width="2"/>
<text x="946" y="289" text-anchor="start" fill="#77dfb8" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">08 / RETURN TO PYTHON MODE</text>
<text x="946" y="325" text-anchor="start" fill="#eef6ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">Resume and run the next line</text>
<rect x="945" y="344" width="529" height="151" rx="8" fill="#172a3a" stroke="none" stroke-width="1"/>
<text x="961" y="390" text-anchor="start" fill="#ffffff" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">kind = "bug"</text>
<text x="961" y="422" text-anchor="start" fill="#ffffff" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">queues["bug"] = ["Upload crashes"]</text>
<text x="946" y="527" text-anchor="start" fill="#c4d8e7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Python performs the append, then continues the loop.</text>
<text x="40" y="602" text-anchor="start" fill="#b9cfdf" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Illustrative path for one loop iteration. Model tool use may vary.</text>
</svg>
