<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title description">
<title id="title">How Aiython hands a Python expression to an AI model</title>
<desc id="description">The frontend marks and transforms the red-underlined expression in memory. Python executes to that line, where the AI runtime builds a request from the statement, nearby source, object metadata and output type. In this example the model reads the live message with a tool, returns bug, the runtime checks the type, and Python resumes to update its queue.</desc>
<rect x="0" y="0" width="1560" height="620" rx="24" fill="#0b1726" stroke="none" stroke-width="1"/>
<text x="40" y="57" text-anchor="start" fill="#eef6ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700">One expression: source → context → model → Python</text>
<text x="40" y="91" text-anchor="start" fill="#b9cfdf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Arrow = current line. Red squiggle = invalid in plain Python. Lit box = current phase.</text>
<rect x="40" y="116" width="830" height="452" rx="19" fill="#142334" stroke="#405a70" stroke-width="2"/>
<rect x="40" y="116" width="830" height="49" rx="18" fill="#1b3045" stroke="none" stroke-width="1"/>
<rect x="40" y="150" width="830" height="15" rx="0" fill="#1b3045" stroke="none" stroke-width="1"/>
<circle cx="66" cy="141" r="5" fill="#fa817a"/>
<circle cx="85" cy="141" r="5" fill="#f7c663"/>
<circle cx="104" cy="141" r="5" fill="#7bd4a9"/>
<text x="130" y="148" text-anchor="start" fill="#eef6ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700">03_loop.py</text>
<text x="838" y="147" text-anchor="end" fill="#a6c0d2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">SOURCE VIEW</text>
<rect x="57" y="172" width="796" height="334" rx="11" fill="#0f1d2d" stroke="none" stroke-width="1"/>
<text x="119" y="223" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">8</text>
<text x="145" y="223" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">for message in inbox:</text>
<text x="119" y="285" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">9</text>
<text x="191" y="285" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">kind: Literal["bug", "billing"] = classify this message</text>
<path d="M580 295 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0 q4 -5 8 0 q4 5 8 0" fill="none" stroke="#ff6e78" stroke-width="2.8" stroke-linecap="round"/>
<rect x="65" y="312" width="779" height="51" rx="8" fill="#193c34" stroke="#77dfb8" stroke-width="2"/>
<path d="M76 328l13 9-13 9z" fill="#77dfb8"/>
<text x="119" y="347" text-anchor="end" fill="#77dfb8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">10</text>
<text x="191" y="347" text-anchor="start" fill="#ffffff" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="700">queues[kind].append(message)</text>
<text x="119" y="409" text-anchor="end" fill="#7894a8" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="400">12</text>
<text x="145" y="409" text-anchor="start" fill="#bdccda" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400">print(queues)</text>
<text x="65" y="543" text-anchor="start" fill="#77dfb8" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700">LINE 10</text>
<text x="228" y="543" text-anchor="start" fill="#c4d7e6" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400">Python running again</text>
<rect x="900" y="116" width="620" height="452" rx="19" fill="#142334" stroke="#405a70" stroke-width="2"/>
<text x="925" y="151" text-anchor="start" fill="#eef6ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">Execution path</text>
