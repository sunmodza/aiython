[project]
name = "aiython"
version = "0.1.0"
description = "Run Python normally and invoke AI at the current statement"
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "python", "runtime", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "litellm>=1.102.1,<1.103",
    "openrouter>=1.2.19,<1.3",
    "prompt-toolkit>=3.0.53,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "tomlkit>=0.15,<1",
    "typing-extensions>=4.15,<5",
]

[project.urls]
Homepage = "https://github.com/sunmodza/aiython"
Repository = "https://github.com/sunmodza/aiython"
Issues = "https://github.com/sunmodza/aiython/issues"

[project.scripts]
aiython = "aiython:main"

[project.optional-dependencies]
a2a = [
    "a2a-sdk>=1.1.5,<1.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aiython"
