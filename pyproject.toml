[project]
name = "aithon"
version = "0.1.0"
description = "Python with live-runtime AI execution, recovery, and project profiles"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "litellm>=1.102.1,<1.103",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
aithon = "aithon:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
