[project]
site_name = "Aiython"
site_url = "https://sunmodza.github.io/aiython-docs/"
site_description = "Run Python normally and bring in AI at the current statement."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Examples" = "examples.md" },
  { "Guides" = [
    { "Configuration" = "configuration.md" },
    { "Runtime" = "runtime.md" },
    { "Type safety" = "type-safety.md" },
    { "Capabilities" = "capabilities.md" },
    { "Collaboration" = "collaboration.md" },
    { "Measuring performance" = "performance-evaluation.md" },
  ] },
]

[project.theme]
logo = "assets/icon.png"
favicon = "assets/icon.png"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.magiclink" = {}
"pymdownx.snippets" = { base_path = ["."], check_paths = true }
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }
"pymdownx.tasklist" = { custom_checkbox = true }
