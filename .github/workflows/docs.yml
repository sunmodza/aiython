name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/recipes/**"
      - "examples/capabilities/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_docs_site.py"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "docs/**"
      - "examples/recipes/**"
      - "examples/capabilities/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_docs_site.py"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11.16"
          version: latest-known
          enable-cache: false
      - run: uv run --locked --python 3.11.16 zensical build --clean --strict
      - run: uv run --locked --python 3.11.16 python scripts/check_docs_site.py
