version = 3
model = "openrouter/openai/gpt-6-luna"
env_file = ".aiython/credentials.env"
api_key_env = "OPENROUTER_API_KEY"

# Optional capability routes:
# [capabilities]
# embedding = "openai/text-embedding-3-large"
# vision = "gemini/gemini-2.5-flash"


[capabilities]
speech_to_text = {model = "openrouter/openai/gpt-transcribe", api_key_env = "OPENROUTER_API_KEY"}
vision = {model = "openrouter/openai/gpt-6-luna", api_key_env = "OPENROUTER_API_KEY"}
video = {understand = {model = "openrouter/google/gemini-2.5-flash", api_key_env = "OPENROUTER_API_KEY"}, generate = {model = "openrouter/minimax/hailuo-3",api_key_env = "OPENROUTER_API_KEY"}}
image_generation = {model = "openrouter/google/gemini-3.1-flash-image", api_key_env = "OPENROUTER_API_KEY"}
text_to_speech = {model = "openrouter/google/gemini-3.1-flash-tts-preview", api_key_env = "OPENROUTER_API_KEY"}
image_editing = {model = "openrouter/google/gemini-3.1-flash-image", api_key_env = "OPENROUTER_API_KEY"}

document_understanding = {model = "openrouter/openai/gpt-6-luna", api_key_env = "OPENROUTER_API_KEY"}
embedding = {model = "openrouter/baai/bge-m3", api_key_env = "OPENROUTER_API_KEY"}
